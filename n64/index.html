<!DOCTYPE html>
<html>
<head>
	<title>Nintendo 64 Controller Pak Manager JS</title>
	<meta http-equiv="content-Type" content="text/html; charset=UTF-8"/>
	<meta name="description" content="An online web-based Nintendo 64 Controller Pak manager. Support .mpk and DexDrive .n64 dumps and .note exporting and transfering."/>
	<meta name="keywords" content="memory,card,manager,nintendo 64,n64,controller pak,mempak,mpk,online,html5,web,extract,insert,inject,savegame"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
	<link rel="manifest" href="./manifest.json"/>
	<link rel="shortcut icon" href="./favicon192.png" type="image/png" sizes="192x192"/>
	<link rel="apple-touch-icon" sizes="192x192" href="./favicon192.png" /><!-- iOS icons -->

	<link type="text/css" rel="stylesheet" href="../core/memcard_manager.css" media="all"/>
	<script type="text/javascript" src="../core/cash.min.js"></script>
	<script type="text/javascript" src="../core/locale.js"></script>
	<script type="text/javascript" src="../core/shiftjis.js"></script>
	<script type="text/javascript" src="../core/BinaryFile.js"></script>
	<script type="text/javascript" src="../core/memcard_manager.js"></script>
	<script type="text/javascript" src="./n64.js"></script>
	<script type="text/javascript">
		if(window.location.protocol==='http:' && window.location.hostname==='www.marcrobledo.com')
			location.href=window.location.href.replace('http:','https:');
	</script>
</head>
<body class="red">

<!-- HEADER -->
<header>
	<a href="../"><img src="logo.png" /></a>
	<h1 class="hide">Nintendo 64 Controller Pak Manager JS</h1>
</header>

<!-- MAIN -->
<div id="memcards"></div>

<!-- FOOTER -->
<footer>
	Nintendo 64 Controller Pak Manager JS <small>v0.9</small> by <a href="https://www.marcrobledo.com">Marc Robledo</a>
	<br />
	<a href="https://www.paypal.me/marcrobledo/5" target="_blank" rel="nofollow" class="footer-link footer-link-donate"><img src="../core/assets/octicon_heart.svg" class="octicon" loading="lazy" /> <i class="icon heart"></i> <span data-localize="*">Donate</span></a>
	<a href="https://github.com/marcrobledo/memory-card-manager-js/" target="_blank" class="footer-link footer-link-github"><img src="../core/assets/octicon_github.svg" class="octicon" loading="lazy" /> See on <img src="../core/assets/octicon_github_logo.svg" class="octicon" loading="lazy" alt="GitHub" /></a>
</footer>





<div id="template-memcard" class="memcard" hidden>
	<h2><span data-localize="*">Slot</span> <span class="memcard-slot"></span></h2>

	<div class="container-toolbar">
		<div class="container-info">
			<div class="container-summary"></div>
			<div class="container-progress-bar"><div class="progress-bar"></div></div>
		</div>

		<div class="container-menu">
			<button class="btn btn-save btn-primary"><img src="../core/assets/octicon_download_white.svg" class="octicon" /> <span data-localize="*">Save</span> .mpk</button>
			<button class="btn btn-more"><img src="../core/assets/octicon_kebab.svg" class="octicon" /></button>
		</div>
	</div>
	<div class="contents"></div>
</div>

<div id="template-content" class="content" hidden>
	<div class="container-icon"></div>
	<div class="container-info">
		<div class="container-name text-truncate"></div>
		<div class="container-summary text-truncate"></div>
	</div>
	<div class="container-menu">
		<button class="btn btn-more"><img src="../core/assets/octicon_kebab.svg" class="octicon" /></button>
	</div>
</div>




<ul id="dropdown-memcard" class="dropdown hide">
	<li><button id="btn-memcard-load"><img src="../core/assets/octicon_upload.svg" class="octicon" /> <span data-localize="*">Load</span> .mpk/.n64/.note</button></li>
	<li><button id="btn-memcard-format" class="text-danger"><img src="../core/assets/octicon_trash.svg" class="octicon" /> <span data-localize="*">Format</span></button></li>
</ul>
			
<ul id="dropdown-content" class="dropdown hide">
	<li><button id="btn-content-save"><img src="../core/assets/octicon_download.svg" class="octicon" /> <span data-localize="*">Save</span> .note</button></li>
	<li><button id="btn-content-copy-next"><img src="../core/assets/octicon_package_dependents.svg" class="octicon" /> <span data-localize="*">Copy to slot</span> <span id="btn-content-copy-slot-next"></span></button></li>
	<li><button id="btn-content-copy-prev"><img src="../core/assets/octicon_package_dependencies.svg" class="octicon" /> <span data-localize="*">Copy to slot</span> <span id="btn-content-copy-slot-prev"></span></button></li>
	<li><button id="btn-content-edit"><img src="../core/assets/octicon_pencil.svg" class="octicon" /> <span data-localize="*">Edit</span></button></li>
	<li><button id="btn-content-delete" class="text-danger"><img src="../core/assets/octicon_trash.svg" class="octicon" /> <span data-localize="*">Delete</span></button></li>
</ul>


<dialog id="modal-content" class="modal">
	<div class="modal-row">
		<span data-localize="*">Size</span>: <span id="modal-content-sizeText"></span>
	</div>
	<div class="modal-row">
		<label for="modal-content-fileName" data-localize="*">File name</label>
		<input type="text" id="modal-content-fileName" maxlength="16" />
	</div>
	<div class="modal-row">
		<label for="modal-content-extension" data-localize="*">Extension</label>
		<input type="text" id="modal-content-extension" maxlength="4" />
	</div>
	<div class="modal-row">
		<label for="modal-content-gameCode" data-localize="*">Game code</label>
		<input type="text" id="modal-content-gameCode" maxlength="4" />
	</div>
	<div class="modal-row">
		<label for="modal-content-publisherCode" data-localize="*">Publisher code</label>
		<input type="text" id="modal-content-publisherCode" maxlength="2" />
	</div>
	<div class="modal-footer">
		<button class="btn btn-cancel" data-localize="*">Cancel</button>
		<button class="btn btn-primary"><img src="../core/assets/octicon_check_white.svg" class="octicon" /> <span data-localize="*">Save</span></button>
	</div>
</dialog>

<dialog id="modal-format" class="modal">
	<div class="modal-row" data-localize="*">
		Format memory card?
	</div>
	<div class="modal-footer">
		<button class="btn btn-cancel" data-localize="*">Cancel</button>
		<button class="btn btn-danger"><img src="../core/assets/octicon_trash_white.svg" class="octicon" /> <span data-localize="*">Format</span></button>
	</div>
</dialog>

<dialog id="modal-content-delete" class="modal">
	<div class="modal-row" data-localize="*">
		Delete content?
	</div>
	<div class="modal-footer">
		<button class="btn btn-cancel" data-localize="*">Cancel</button>
		<button class="btn btn-danger"><img src="../core/assets/octicon_trash_white.svg" class="octicon" /> <span data-localize="*">Delete</span></button>
	</div>
</dialog>

</body></html>
